<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>חשבונות בית</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=a0300601">
</head>
<body>
  <div class="blob" aria-hidden="true"></div>
  <div class="app" id="app">
    <header class="top" id="top" hidden>
      <div>
        <div class="top-sub" id="topSub">שלום, משפחה</div>
        <h1 id="topTitle">חשבונות בית</h1>
      </div>
      <div class="top-actions" id="topActions"></div>
    </header>

    <!-- Messages and the single-kid #m= page: plain URL card, invalid link, no connection. -->
    <div id="familyView" hidden></div>

    <main id="appMain" hidden>
      <section class="tab-panel" id="tab-home" role="tabpanel" aria-labelledby="tabBtn-home">
        <div id="famUpdateHost"></div>
        <div id="ownerHost"></div>
        <div id="summary"></div>
        <div id="backupHost"></div>
      </section>
      <section class="tab-panel" id="tab-graphs" role="tabpanel" aria-labelledby="tabBtn-graphs" hidden>
        <div class="card" id="trendCard" hidden></div>
        <div class="card" id="waterInsight" hidden></div>
        <p class="card empty" id="graphsEmpty" hidden>עוד אין מספיק נתונים לגרפים</p>
      </section>
      <section class="tab-panel" id="tab-bills" role="tabpanel" aria-labelledby="tabBtn-bills" hidden>
        <div class="card" id="billsCard"></div>
        <div class="card" id="otherBills" hidden></div>
      </section>
      <section class="tab-panel" id="tab-past" role="tabpanel" aria-labelledby="tabBtn-past" hidden>
        <div class="sec-head"><h2>תקופות קודמות</h2><span class="muted" id="pastCount"></span></div>
        <div id="archive"></div>
      </section>
    </main>
  </div>

  <nav class="tabbar" id="tabbar" role="tablist" aria-label="מסכים" hidden>
    <button class="tab" role="tab" id="tabBtn-home" data-tab="home" aria-controls="tab-home" aria-selected="true"><span class="ic" data-icon="home"></span>בית</button>
    <button class="tab" role="tab" id="tabBtn-past" data-tab="past" aria-controls="tab-past" aria-selected="false" tabindex="-1"><span class="ic" data-icon="clock"></span>היסטוריה</button>
    <button class="tab" role="tab" id="tabBtn-graphs" data-tab="graphs" aria-controls="tab-graphs" aria-selected="false" tabindex="-1"><span class="ic" data-icon="chart"></span>גרפים</button>
    <button class="tab" role="tab" id="tabBtn-bills" data-tab="bills" aria-controls="tab-bills" aria-selected="false" tabindex="-1"><span class="ic" data-icon="receipt"></span>חשבוניות</button>
  </nav>

  <script src="icons.js?v=3d844146"></script>
  <script src="sheet.js?v=87d36a8a"></script>
  <script src="calc.js?v=9b9d8213"></script>
  <script src="format.js?v=533f0219"></script>
  <script src="history.js?v=0a3e4933"></script>
  <script src="unit-price.js?v=0a884e7c"></script>
  <script src="meter-photos.js?v=e399f38d"></script>
  <script src="view-model.js?v=e17d73bf"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=f09cccd4"></script>
  <script type="module" src="family-page.js?v=62465187"></script>
  <script src="store-map.js?v=80e11b1a"></script>
  <script src="store.js?v=fe5d4cb3"></script>
  <script src="owner-cycle.js?v=d3f6bcc2"></script>
  <script src="app.js?v=fcf58d5a"></script>
</body>
</html>
